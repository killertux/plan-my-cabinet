name: Release

# Push a tag such as v0.2.0 (matching Cargo.toml's version) to build the
# desktop packages and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: --archive
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: --archive
          # The oldest supported runner keeps the glibc requirement low.
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # No Visual C++ redistributable needed on the user's machine.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | "$(command -v python3 || command -v python)" -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Package
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          SOURCE_DATE_EPOCH: "0"
        run: |
          "$(command -v python3 || command -v python)" scripts/package-release.py \
            ${{ matrix.platform }} ${{ matrix.archive }} --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Plan My Cabinet $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

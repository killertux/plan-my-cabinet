[package]
name = "plan-my-cabinet"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts", "accesskit"] }
fluent-bundle = "0.16"
pollster = "0.4"
printpdf = { version = "=0.8.2", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unic-langid = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
ttf-parser = "0.25"

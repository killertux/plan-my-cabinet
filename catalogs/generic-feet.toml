# Generic furniture feet and table legs.
#
# Representative dimensions of product types commonly sold in Brazil, measured
# from typical listings; not a manufacturer's sheet. Use them to see and plan
# the piece; check the product you buy. Pack status "generic" is shown as
# "generic reference dimensions" on screen and in exports.
#
# Units are millimetres. Each foot's box starts at its minimum corner with Z
# up; the mounting face is on top (Z = height), centred. mounting_holes are
# X, Y from the centre of that face. Colors are sRGB "#rrggbb".


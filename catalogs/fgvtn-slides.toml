# FGVTN / TN telescopic drawer slides (Brazil).
#
# Facts only, transcribed from the manufacturer's public sheets and checked
# visually against a raster of each page (docs/catalogs/fgvtn-slides-review.md).
# The PDFs are cited by URL and SHA-256 and are not redistributed.
#
# Units are millimetres. Holes are measured along each member from its front
# end, on the member's centre line. cabinet_holes are on the cabinet (outer)
# member, drawer_holes on the drawer (inner) member. front_setback is the gap
# from the cabinet front edge to the slide front (37 to the first hole, which
# is 35 from the member front).

